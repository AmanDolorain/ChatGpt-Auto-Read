<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ChatGPT Auto Read</title>
<link rel="stylesheet" href="popup.css">
<main>
  <label class="row"><span>Auto Read</span><input id="enabled" type="checkbox" role="switch"></label>
  <label for="speed" class="row"><span>Speed</span><output id="speed-value" for="speed">1.00×</output></label>
  <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
</main>
<script src="popup.js"></script>
</html>
